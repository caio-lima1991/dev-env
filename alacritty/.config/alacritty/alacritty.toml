[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[window]
decorations = "Full"
startup_mode = "Maximized"

[font]
normal.family = "CodeNewRoman Nerd Font"
size = 11

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = true
