[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"
WSLENV = "COLORTERM/u"

[window]
decorations = "None"
startup_mode = "Fullscreen"

[font]
size = 11

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = true

[terminal.shell]
program = "wsl.exe"
args = [
    "~",
    "-d",
    "archlinux"
]
