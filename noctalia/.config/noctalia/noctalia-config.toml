[bar.default]
margin_edge = 0
margin_ends = 0
radius = 0
thickness = 30

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 60.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 120.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 15.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 1081.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[shell]
font_family = "CodeNewRoman Nerd Font Mono"

    [shell.panel]
    control_center_position = "top_right"
    open_near_click_control_center = true

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/caiols/Imagens"

    [wallpaper.default]
    path = "/home/caiols/Imagens/wallpaper.jpg"

[widget.clock]
format = "{:%H:%M - %b %d}"

[widget.network]
show_label = false
